# Correspondence file: CF-problems highlighted example (Myra pneumonia problem concern)
selector:
  section: "11450-4"           # PROBLEM LIST
  entryId: "1.3.6.1.4.1.22812.3.2009316.3.4.1"
  element: act
binary: CDA-Input-Condition
resources:
  - FHIR-Output-Condition
rows:
  - cda: entryRelationship[@typeCode="SUBJ"]/observation/id[1]/@root
    fhir: FHIR-Output-Condition.identifier[0].system
    transform: oid-to-urn
  - cda: entryRelationship[@typeCode="SUBJ"]/observation/id[1]/@extension
    fhir: FHIR-Output-Condition.identifier[0].value
  - cda: statusCode/@code
    fhir: FHIR-Output-Condition.clinicalStatus.coding[0].code
    transform: conceptmap CF-ConditionClinicalStatus
  - cda: ../../code/@code
    fhir: FHIR-Output-Condition.category[0].coding[0].code
    transform: conceptmap CF-ProblemCategory
    note: "category derives from the containing section code"
  - cda: entryRelationship[@typeCode="SUBJ"]/observation/effectiveTime/low/@value
    fhir: FHIR-Output-Condition.onsetDateTime
    transform: cda-date
  - cda: entryRelationship[@typeCode="SUBJ"]/observation/author/time/@value
    fhir: FHIR-Output-Condition.recordedDate
    uscdi: "Provenance / Author Time Stamp"
    transform: cda-date
    note: "earliest author time (map rule: earliest, if more than one)"
  - cda: entryRelationship[@typeCode="SUBJ"]/observation/value/@code
    fhir: FHIR-Output-Condition.code.coding[0].code
    uscdi: "Problems / Problems"
  - cda: entryRelationship[@typeCode="SUBJ"]/observation/value/@displayName
    fhir: FHIR-Output-Condition.code.coding[0].display
    transform: display
  - cda: entryRelationship[@typeCode="SUBJ"]/observation/value/@codeSystem
    fhir: FHIR-Output-Condition.code.coding[0].system
    transform: oid-to-uri
  - cda: entryRelationship[@typeCode="SUBJ"]/observation/value/translation[1]/@code
    fhir: FHIR-Output-Condition.code.coding[1].code
  - cda: entryRelationship[@typeCode="SUBJ"]/observation/value/translation[1]/@codeSystem
    fhir: FHIR-Output-Condition.code.coding[1].system
    transform: oid-to-uri
  - cda: entryRelationship[@typeCode="SUBJ"]/observation/value/translation[2]/@code
    fhir: FHIR-Output-Condition.code.coding[2].code
  - cda: entryRelationship[@typeCode="SUBJ"]/observation/value/translation[2]/@codeSystem
    fhir: FHIR-Output-Condition.code.coding[2].system
    transform: oid-to-uri
  - cda: entryRelationship[@typeCode="SUBJ"]/observation/value/translation[3]/@code
    fhir: FHIR-Output-Condition.code.coding[3].code
  - cda: entryRelationship[@typeCode="SUBJ"]/observation/value/translation[3]/@codeSystem
    fhir: FHIR-Output-Condition.code.coding[3].system
    transform: oid-to-uri
